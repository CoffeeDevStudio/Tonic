name: Release

# Push a tag like v1.0.0 (or v1.0.0-beta1) to package and upload to CurseForge, Wago
# and GitHub Releases. Uploads happen only for the stores whose secrets and TOC IDs
# are configured (see RELEASING.md).

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The palettes and textures are regenerated before packaging.
      - name: Generate tokens
        working-directory: tools/tokens
        run: |
          npm ci
          npm test
          npm run gen

      - name: Package and upload
        uses: BigWigsMods/packager@v2
